[project]
name = "jobfalcon-backend"
version = "0.1.0"
description = "JobFalcon - Agentic Career Opportunity Recommendation System Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "mcp>=2.3.0",
    "mcp-jobspy>=1.4.1",
    "langgraph>=0.2.0",
    "sse-starlette>=2.1.0",
    "python-multipart>=0.0.12",
    "pypdf>=5.0.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
